[project]
name = "esmporium"
version = "0.1.2.post1"
description = "Unified data retrieval from ESGF and access to datasets"
authors = [
    { name = "Anna Zehrung", email = "zehrunga@unimelb.edu.au" },
    { name = "Zebedee Nicholls", email = "zebedee.nicholls@climate-energy-college.org" },
]
license = { text = "3-Clause BSD License" }
requires-python = ">=3.10"
dependencies = [
    # Required because the database lives on the user's machine,
    # so the user's own process is the only thing
    # that can ever migrate it to a newer schema.
    "alembic>=1.13.0",
    # If you use numpy, we suggest pinning to >2.1.0
    # based on the minimum supported python version
    "pandas>=2.2.0", # pin based on minimum supported python version
    "sqlmodel>=0.0.39",
]
readme = "README.md"
classifiers = [
    # Full list: https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://esmporium.readthedocs.io"
Documentation = "https://esmporium.readthedocs.io"
Changelog = "https://esmporium.readthedocs.io/en/stable/changelog"
Repository = "https://github.com/esmporium/esmporium"
Issues = "https://github.com/esmporium/esmporium/issues"


[project.optional-dependencies]
plots = [
    "matplotlib>=3.7.1",  # pin based on minimum supported python version
]
full = [
    "esmporium[plots]",
]

[dependency-groups]
# The development dependencies are pinned
# to give a consistent starting point when using this template.
# They should be removed/updated/changed/loosened as suits your project.
# (As soon as you have a lock file, you can remove all of the implied dependencies.)
# (This is a workaround for the fact
# that we can't easily include the lock file in the copier template
# because of how locking works and the order of operations).
dev = [
    # Key dependencies
    # ----------------
    "liccheck==0.9.2",
    "mypy==1.14.0",
    # Required for liccheck, see https://github.com/dhatim/python-license-check/pull/113
    "pip==24.3.1",
    "pre-commit==4.0.1",
    # Required for liccheck, see https://github.com/dhatim/python-license-check/pull/113
    "setuptools==75.6.0",
    "tomli==2.2.1 ; python_full_version < '3.11'",
    "tomli-w==1.2.0",
    "towncrier==24.8.0",
    # Key dependencies for include_ty
    # -------------------------------
    "ty==0.0.33",
    "typer>=0.27.1",
]
docs = [
    # Key dependencies
    # ----------------
    "attrs==25.3.0",
    "mkdocs-autorefs==1.4.4",
    "mkdocs-gen-files==0.6.1",
    "mkdocs-literate-nav==0.6.3",
    "mkdocs-material==9.7.6",
    "mkdocs-section-index==0.3.12",
    "mkdocstrings-python-xref==2.1.1",
    "mkdocstrings-python==2.0.3",
    "properdocs==1.6.7",
    "pymdown-extensions==10.21.3",
    "ruff==0.15.12",
    # Key dependencies for notebook_based_docs
    # ----------------------------------------
    "jupyterlab==4.4.5",
    "jupytext==1.17.2",
    "mkdocs-jupyter==0.25.1",
]
# For minimum test dependencies.
# These are used when running our minimum PyPI install tests.
tests-min = [
    # Key dependencies
    # ----------------
    "hypothesis==6.165.3",
    "pytest==8.3.4",
    "pytest-regressions==2.11.0",
]
tests-full = [
    # Key dependencies
    # ----------------
    "pytest-cov==6.0.0",
]
# Test dependencies
# (partly split because liccheck uses toml,
# which doesn't support inhomogeneous arrays).
tests = [
    {include-group = "tests-min"},
    {include-group = "tests-full"},
]
all-dev = [
    {include-group = "dev"},
    {include-group = "docs"},
    {include-group = "tests"},
]

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "src/esmporium",
    "LICENCE",
]

[tool.coverage.run]
source = ["esmporium"]
branch = true

[tool.coverage.report]
fail_under = 90
skip_empty = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING",
    # Type overloading lines
    "@overload",
    "\\.\\.\\.",

]

[tool.mypy]
strict = true
disallow_any_unimported = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
follow_imports = "normal"

[tool.ty.environment]
extra-paths = ["stubs"]
python-version = "3.10"

[tool.ty.rules]

[tool.ty.src]
include = ["src"]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    # Alembic's `env.py` runs migrations as an import side effect
    # and is meaningless outside an alembic invocation,
    # so `--doctest-modules` must not collect it.
    "--ignore=src/esmporium/db/migrations",
]

[tool.ruff]
src = [
    "src",
]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "D",
    "PL",
    "TRY",
    "NPY",
    "RUF",
    "UP",
    "S",
]
unfixable = [
    "PD002",
]
ignore = [
    "D200",
    "D400",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"test*.py" = [
    "D",
    "S101",
    "PLR2004",
]
# Migration scripts are generated, then reviewed by hand.
# They must import `sqlmodel.sql.sqltypes` because that is where the column types
# in a SQLModel-generated migration come from, but plenty of migrations
# (e.g. one that only adds an index) never reference it.
# We could try and automate this more cleverly, it's not worth it,
# just ignore this RUFF rule for these files.
"src/esmporium/db/migrations/versions/*.py" = [
    "F401",
]
"docs/*" = [
    "D100",
    "E402",
    "S101",
]
"scripts/*" = [
    "S101",
]
"stubs/*" = [
    "PLR0913",
]

[tool.ruff.lint.isort]
known-first-party = [
    "src",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.towncrier]
package = "esmporium"
package_dir = "src"
filename = "docs/changelog.md"
directory = "changelog/"
title_format = "## esmporium {version} ({project_date})"
underlines = [
    "",
    "",
    "",
]
issue_format = "[#{issue}](https://github.com/esmporium/esmporium/pull/{issue})"
type = [
    { directory = "breaking", name = "⚠️ Breaking Changes", showcontent = true },
    { directory = "deprecation", name = "🗑️ Deprecations", showcontent = true },
    { directory = "feature", name = "🆕 Features", showcontent = true },
    { directory = "improvement", name = "🎉 Improvements", showcontent = true },
    { directory = "fix", name = "🐛 Bug Fixes", showcontent = true },
    { directory = "docs", name = "📚 Improved Documentation", showcontent = true },
    { directory = "trivial", name = "🔧 Trivial/Internal Changes", showcontent = false },
]

[tool.liccheck]
authorized_licenses = [
    "bsd",
    "bsd license",
    "BSD 3-Clause",
    "BSD-3-Clause",
    # numpy special case
    "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0",
    "CC0",
    "apache",
    "apache 2.0",
    "apache-2.0",
    "apache software",
    "apache software license",
    "Apache License, Version 2.0",
    "CMU License (MIT-CMU)",
    "Historical Permission Notice and Disclaimer (HPND)",
    "isc",
    "isc license",
    "isc license (iscl)",
    "gnu lgpl",
    "lgpl with exceptions or zpl",
    "LGPLv2+",
    "GNU Lesser General Public License v2 (LGPLv2)",
    "GNU Lesser General Public License v2 or later (LGPLv2+)",
    "mit",
    # greenlet special case
    "MIT AND PSF-2.0",
    "mit license",
    "Mozilla Public License 2.0 (MPL 2.0)",
    "psf-2.0",
    "python software foundation",
    "python software foundation license",
    "The Unlicense (Unlicense)",
    "zpl 2.1",
]
unauthorized_licenses = [
    "agpl",
    "gnu agpl",
    "gpl v3",
    "gplv3",
    "gpl v2",
    "gplv2",
    "gpl v1",
    "gplv1",
]
