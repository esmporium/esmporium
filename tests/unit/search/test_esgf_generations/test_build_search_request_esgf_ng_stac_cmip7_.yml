json_body:
  filter:
    args:
    - args:
      - property: collection
      - CMIP7
      op: '='
    - args:
      - property: cmip7:experiment_id
      - - historical
        - esm-hist
      op: in
    - args:
      - property: cmip7:variable_id
      - - tas
      op: in
    - args:
      - property: cmip7:frequency
      - - mon
      op: in
    - args:
      - property: cmip7:variable_branding_suffix
      - - tavg-h2m-hxy-air
      op: in
    - args:
      - property: cmip7:region
      - - global
      op: in
    op: and
  filter-lang: cql2-json
  limit: 25
method: POST
params: null
path: /search
