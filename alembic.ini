# Alembic configuration, used for *authoring* migrations during development.
#
# esmporium does not read this file at runtime.
# When esmporium migrates a user's database it builds an equivalent
# configuration in code, see `esmporium.db.migrate`.
# That is deliberate: the database lives on the user's machine,
# so there is no deployment step at which an operator could run `alembic upgrade`.
#
# To author a new migration, use `make migration MESSAGE="what you changed"`,
# which applies the existing migrations to a scratch database
# and then diffs the models against it.

[alembic]
script_location = src/esmporium/db/migrations
prepend_sys_path = src

# Date-prefixed filenames so `versions/` reads in chronological order.
# (Alembic's ordering is defined by the revision chain, not the filenames,
# but humans read the directory listing.)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# A throwaway, gitignored database used only to diff the models against.
# `make migration` deletes it before and after, so autogenerate always compares
# against "every migration applied from scratch".
sqlalchemy.url = sqlite:///alembic-scratch.db


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
